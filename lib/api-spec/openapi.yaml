openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: templates
    description: Excel template catalog
  - name: dashboard
    description: Workspace overview
  - name: reports
    description: Completed report workflow
  - name: uploads
    description: Protected document upload workflow
paths:
  /agro/fields:
    get:
      operationId: getFieldDashboard
      responses:
        "200":
          description: Field directory, crop rotations and operation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDashboard" }
    post:
      operationId: createAgroField
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgroFieldInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgroField" }
  /agro/fields/{id}:
    patch:
      operationId: updateAgroField
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgroFieldUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgroField" }
  /agro/fields/seasons:
    post:
      operationId: createFieldSeason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldSeasonInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSeason" }
  /agro/fields/seasons/{id}:
    patch:
      operationId: updateFieldSeason
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldSeasonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSeason" }
  /agro/fields/operations:
    post:
      operationId: createFieldOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldOperationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}:
    patch:
      operationId: updateFieldOperation
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldOperationUpdate" }
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}/actual:
    patch:
      operationId: updateFieldOperationActual
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldActualInput" }
      responses:
        "200":
          description: Updated actual results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}/void:
    post:
      operationId: voidFieldOperation
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldOperationVoidInput" }
      responses:
        "200":
          description: Cancelled with audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/grain:
    get:
      operationId: getGrainDashboard
      tags: [grain]
      responses:
        "200":
          description: Grain ledger, directories and current inventory, tonnes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainDashboard"
  /agro/grain/crops:
    post:
      operationId: createGrainCrop
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainCropInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainCrop"
  /agro/grain/locations:
    post:
      operationId: createGrainLocation
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainLocationInput"
      responses:
        "201":
          description: Created storage location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainLocation"
  /agro/grain/movements:
    post:
      operationId: createGrainMovement
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainMovementInput"
      responses:
        "201":
          description: Posted movement or safely replayed submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainMovement"
        "409":
          description: Insufficient stock or reused request key
  /agro/grain/movements/{id}/void:
    post:
      operationId: voidGrainMovement
      tags: [grain]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainVoidInput"
      responses:
        "200":
          description: Cancelled movement retained in audit ledger, general director only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainMovement"
        "409":
          description: Cancellation would cause a negative stock balance
  /engineering/fleet:
    get:
      operationId: listFleetEquipment
      tags: [engineering]
      responses:
        "200":
          description: Shared equipment directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetEquipment"
    post:
      operationId: createFleetEquipment
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FleetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetEquipment"
  /engineering/fleet/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    put:
      operationId: updateFleetEquipment
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FleetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetEquipment"
    delete:
      operationId: deleteFleetEquipment
      tags: [engineering]
      responses:
        "204":
          description: Removed only if unused, general director only
  /engineering/repair-plan/batch:
    post:
      operationId: createRepairPlanBatch
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanBatchInput"
      responses:
        "201":
          description: Plan rows added atomically
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepairEntry"
  /engineering/expenses:
    get:
      operationId: listRepairExpenses
      tags: [engineering]
      parameters:
        - { name: fleetId, in: query, schema: { type: number } }
      responses:
        "200":
          description: Equipment expense ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepairExpense"
    post:
      operationId: createRepairExpense
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairExpense"
  /engineering/expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    put:
      operationId: updateRepairExpense
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairExpense"
    delete:
      operationId: deleteRepairExpense
      tags: [engineering]
      responses:
        "204":
          description: Removed by general director
  /engineering/repairs:
    get:
      operationId: listEngineeringRepairs
      tags: [engineering]
      summary: Current equipment repair register and totals
      parameters:
        - name: unit
          in: query
          schema:
            type: string
            enum: ["АПК Арыстан Grain", "АФ Веденовка"]
      responses:
        "200":
          description: Current repair register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairDashboard"
    post:
      operationId: createEngineeringRepair
      tags: [engineering]
      summary: Record an equipment repair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Repair recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairEntry"
  /engineering/repairs/{id}:
    put:
      operationId: updateEngineeringRepair
      tags: [engineering]
      summary: Update a repair with optimistic concurrency protection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairEntry"
        "409":
          description: Repair changed by another user; reload before saving
    delete:
      operationId: deleteEngineeringRepair
      tags: [engineering]
      summary: Delete a repair as general director only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Repair removed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List templates
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Add a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get template details
      parameters:
        - name: id
          in: path
          required: true
          schema:
             type: number
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
             type: number
      responses:
        "204":
          description: Deleted
  /templates/{id}/download:
    get:
      operationId: downloadTemplate
      tags: [templates]
      summary: Download an authorized template file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Original template file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List completed reports
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, in_review, returned, approved, sent_to_management, archived]
        - name: unit
          in: query
          required: false
          schema:
            type: string
        - name: archiveSection
          in: query
          required: false
          schema:
            type: string
            enum: [agronomical, engineering, economic, accounting, legal]
        - name: archiveSubarchive
          in: query
          required: false
          schema:
            type: string
            enum: [seeding_reports, chemistry_reports, harvesting_reports, crop_rotations, tech_maps, general]
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a completed report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Submitted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/upload-url:
    post:
      operationId: requestReportUploadUrl
      tags: [uploads]
      summary: Request a protected upload URL for a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadTarget"
  /reports/{id}/status:
    patch:
      operationId: updateReportStatus
      tags: [reports]
      summary: Update report review status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportStatusUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/{id}:
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report as general director
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Report deleted
  /archives:
    get:
      operationId: listArchives
      tags: [archives]
      summary: List archive cells and document counts
      responses:
        "200":
          description: Archive cells
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchiveCell"
  /reports/{id}/download:
    get:
      operationId: downloadReport
      tags: [reports]
      summary: Download an authorized completed report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Original report file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /role-requests/me:
    get:
      operationId: getMyRoleRequest
      tags: [access]
      summary: Get current user's role request
      responses:
        "200":
          description: Current role request or null
          content:
            application/json:
              schema:
                type: [object, "null"]
                properties:
                  id:
                    type: number
                  userId:
                    type: string
                  email:
                    type: string
                  displayName:
                    type: string
                  department:
                    type: string
                  requestedRole:
                    type: string
                    enum: [agronomist, chief_agronomist, engineer, chief_engineer, economist, lawyer, farm_director, general_director]
                  status:
                    type: string
                    enum: [pending, approved, rejected]
                  reviewComment:
                    type: string
                  reviewedByName:
                    type: string
                  requestedAt:
                    type: string
                  reviewedAt:
                    type: [string, "null"]
                required: [id, userId, email, displayName, department, requestedRole, status, reviewComment, reviewedByName, requestedAt, reviewedAt]
  /role-requests:
    get:
      operationId: listRoleRequests
      tags: [access]
      summary: List pending role requests for the current reviewer
      responses:
        "200":
          description: Pending role requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleRequest"
    post:
      operationId: createRoleRequest
      tags: [access]
      summary: Submit or resubmit a role request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequestInput"
      responses:
        "201":
          description: Role request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequest"
        "200":
          description: Existing role request resubmitted or synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequest"
  /role-requests/{id}:
    patch:
      operationId: reviewRoleRequest
      tags: [access]
      summary: Approve or reject a role request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequestDecision"
      responses:
        "200":
          description: Reviewed role request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequest"
  /users:
    get:
      operationId: listUsers
      tags: [access]
      summary: List approved users for employee management
      responses:
        "200":
          description: Approved user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleRequest"
  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [access]
      summary: Revoke a user's approved access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: User access revoked
components:
  schemas:
    AgroFieldInput:
      type: object
      required: [unit, number, areaHa, notes, isActive]
      properties:
        unit: { type: string, enum: ["АПК Арыстан Grain", "АФ Веденовка"] }
        number: { type: string, minLength: 1, maxLength: 80 }
        areaHa: { type: number, minimum: 0.01, maximum: 1000000 }
        notes: { type: string, maxLength: 3000 }
        isActive: { type: boolean }
    AgroFieldUpdate:
      allOf:
        - $ref: "#/components/schemas/AgroFieldInput"
        - type: object
          required: [version]
          properties:
            version: { type: number, minimum: 1 }
    AgroField:
      allOf:
        - $ref: "#/components/schemas/AgroFieldUpdate"
        - type: object
          required: [id, updatedBy, updatedAt]
          properties:
            id: { type: number }
            updatedBy: { type: string }
            updatedAt: { type: string }
    FieldSeasonInput:
      type: object
      required: [fieldId, year, cropName, variety, areaHa, notes]
      properties:
        fieldId: { type: number, minimum: 1 }
        year: { type: number, minimum: 2000, maximum: 2100 }
        cropName: { type: string, minLength: 1, maxLength: 100 }
        variety: { type: string, maxLength: 200 }
        areaHa: { type: number, minimum: 0.01, maximum: 1000000 }
        notes: { type: string, maxLength: 3000 }
    FieldSeasonUpdate:
      allOf:
        - $ref: "#/components/schemas/FieldSeasonInput"
        - type: object
          required: [version]
          properties:
            version: { type: number, minimum: 1 }
    FieldSeason:
      allOf:
        - $ref: "#/components/schemas/FieldSeasonUpdate"
        - type: object
          required: [id, updatedBy, updatedAt]
          properties:
            id: { type: number }
            updatedBy: { type: string }
            updatedAt: { type: string }
    FieldOperationInput:
      type: object
      required: [seasonId, name, plannedStart, plannedEnd, plannedAreaHa, responsible, plannedEquipment, plannedImplement, notes]
      properties:
        seasonId: { type: number, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        plannedStart: { type: string }
        plannedEnd: { type: string }
        plannedAreaHa: { type: number, minimum: 0.01, maximum: 1000000 }
        responsible: { type: string, maxLength: 200 }
        plannedEquipment: { type: string, maxLength: 200 }
        plannedImplement: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 3000 }
    FieldOperationUpdate:
      allOf:
        - $ref: "#/components/schemas/FieldOperationInput"
        - type: object
          required: [version]
          properties:
            version: { type: number, minimum: 1 }
    FieldActualInput:
      type: object
      required: [version, actualStart, actualEnd, actualAreaHa, actualOperationName, actualMechanic, actualEquipment, actualImplement, actualNotes]
      properties:
        version: { type: number, minimum: 1 }
        actualStart: { type: ["string", "null"] }
        actualEnd: { type: ["string", "null"] }
        actualAreaHa: { type: number, minimum: 0, maximum: 1000000 }
        actualOperationName: { type: string, maxLength: 150 }
        actualMechanic: { type: string, maxLength: 200 }
        actualEquipment: { type: string, maxLength: 200 }
        actualImplement: { type: string, maxLength: 200 }
        actualNotes: { type: string, maxLength: 3000 }
    FieldOperationVoidInput:
      type: object
      required: [version, reason]
      properties:
        version: { type: number, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    FieldOperation:
      allOf:
        - $ref: "#/components/schemas/FieldOperationUpdate"
        - $ref: "#/components/schemas/FieldActualInput"
        - type: object
          required: [id, status, isOverdue, progressPercent, voidedAt, voidReason, voidedBy, updatedAt, updatedBy]
          properties:
            id: { type: number }
            status: { type: string, enum: [planned, in_progress, completed, cancelled] }
            isOverdue: { type: boolean }
            progressPercent: { type: number }
            voidedAt: { type: ["string", "null"] }
            voidReason: { type: string }
            voidedBy: { type: string }
            updatedAt: { type: string }
            updatedBy: { type: string }
    FieldDashboard:
      type: object
      required: [fields, seasons, operations, cropSuggestions, asOfDate]
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/AgroField" }
        seasons:
          type: array
          items: { $ref: "#/components/schemas/FieldSeason" }
        operations:
          type: array
