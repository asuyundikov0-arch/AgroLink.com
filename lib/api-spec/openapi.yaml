openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: templates
    description: Retired module; all endpoints return HTTP 410
  - name: dashboard
    description: Retired document overview; all endpoints return HTTP 410
  - name: reports
    description: Retired manual report workflow; all endpoints return HTTP 410
  - name: uploads
    description: Retired document upload workflow; all endpoints return HTTP 410
paths:
  /agro/supporting-tasks/batch:
    post:
      operationId: createSupportingTaskBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportingTaskBatchInput" }
      responses:
        "201":
          description: All supporting works saved or sent atomically, including unplanned supporting works
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportingTask" } }
  /agro/supporting-tasks:
    get:
      operationId: listSupportingTasks
      parameters:
        - { name: operationId, in: query, required: false, schema: { type: number, minimum: 1 } }
        - { name: service, in: query, required: false, schema: { type: string, enum: [tok, motor_pool, fuel] } }
      responses:
        "200":
          description: Role-filtered task outbox or service inbox
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportingTask" } }
    post:
      operationId: createSupportingTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportingTaskCreateInput" }
      responses:
        "201":
          description: Independent draft copied from planned supporting work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportingTask" }
  /agro/supporting-tasks/{id}:
    patch:
      operationId: updateSupportingTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportingTaskUpdateInput" }
      responses:
        "200":
          description: Owned draft changed without changing the chief agronomist plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportingTask" }
  /agro/supporting-tasks/{id}/send:
    post:
      operationId: sendSupportingTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportingTaskVersionInput" }
      responses:
        "200":
          description: Single task dispatched to selected services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportingTask" }
  /agro/supporting-tasks/{id}/accept:
    post:
      operationId: acceptSupportingTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportingTaskAcceptInput" }
      responses:
        "200":
          description: Recipient service acknowledged receipt; not completion or an expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportingTask" }
  /agro/tok-payroll/entries:
    get:
      operationId: listTokPayrollEntries
      responses:
        "200":
          description: Начисления сотрудников тока
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TokPayrollEntry" } }
    post:
      operationId: createTokPayrollEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokPayrollCreateInput" }
      responses:
        "201":
          description: Начисление сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokPayrollEntry" }
  /agro/tok-payroll/entries/{id}:
    patch:
      operationId: updateTokPayrollEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokPayrollUpdateInput" }
      responses:
        "200":
          description: Начисление изменено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokPayrollEntry" }
  /engineering/fuel:
    get:
      operationId: getFuelWarehouse
      responses:
        "200":
          description: Fuel stocks, immutable movements and field work assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelWarehouse"
  /engineering/fuel/receipts:
    post:
      operationId: createFuelReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuelReceiptInput"
      responses:
        "201":
          description: Fuel receipt posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelMovement"
  /engineering/fuel/issues:
    post:
      operationId: createFuelIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuelIssueInput"
      responses:
        "201":
          description: Fuel issued to a vehicle, optionally charged to field work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelMovement"
  /agro/fields/seasons/{id}/costs:
    get:
      operationId: getFieldCosts
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, minimum: 1 }
      responses:
        "200":
          description: Field season and operation costs from posted chemistry, fuel and HR-confirmed wages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldCosts"
  /agro/chemicals/workflow:
    get:
      operationId: getChemicalWorkflow
      responses:
        "200":
          description: Заявки, подотчётный баланс и ежедневный расход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChemicalWorkflow" }
  /agro/chemicals/requests:
    post:
      operationId: createChemicalRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChemicalRequestInput" }
      responses:
        "201":
          description: Заявка агронома создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChemicalMutationResult" }
  /agro/chemicals/consumptions:
    post:
      operationId: createChemicalConsumption
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChemicalConsumptionInput" }
      responses:
        "201":
          description: Диспетчер подтвердил расход по принятой пустой таре
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChemicalMutationResult" }
  /agro/chemicals/container-returns:
    post:
      operationId: createChemicalContainerReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChemicalContainerReturnInput" }
      responses:
        "201":
          description: Заведующий током принял пустую тару и уведомил диспетчера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChemicalMutationResult" }
  /agro/chemicals/batches/{id}/packaging:
    put:
      operationId: updateChemicalBatchPackaging
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChemicalPackagingInput" }
      responses:
        "200":
          description: Уточнена упаковка ранее принятой партии без изменения остатков
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChemicalMutationResult" }
  /agro/chemicals:
    get:
      operationId: getChemicalWarehouse
      responses:
        "200":
          description: Остатки химии, журнал и затраты по полям
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemicalWarehouse"
  /agro/chemicals/invoices:
    post:
      operationId: createChemicalInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemicalInvoiceInput"
      responses:
        "201":
          description: Накладная оприходована
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemicalMutationResult"
  /agro/chemicals/issues:
    post:
      operationId: createChemicalIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemicalIssueInput"
      responses:
        "201":
          description: Химия выдана на поле
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemicalMutationResult"
  /agro/fields/unplanned-operations:
    post:
      operationId: createUnplannedFieldOperation
      tags: [agro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnplannedFieldOperationInput" }
      responses:
        "201":
          description: Unplanned actual field work recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/seeding-report:
    get:
      operationId: getDailySeedingReport
      tags: [agro]
      parameters:
        - { name: year, in: query, required: true, schema: { type: number } }
        - { name: date, in: query, required: true, schema: { type: string } }
        - { name: unit, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Automatic seeding summary by crop, without field numbers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySeedingReport" }
  /agro/fields:
    get:
      operationId: getFieldDashboard
      responses:
        "200":
          description: Field directory, crop rotations and operation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDashboard" }
    post:
      operationId: createAgroField
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgroFieldInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgroField" }
  /agro/fields/dispatch:
    get:
      operationId: getFieldDispatchQueue
      responses:
        "200":
          description: Completed field operations and dispatcher rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FieldDispatchItem" }
  /agro/fields/{id}:
    patch:
      operationId: updateAgroField
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgroFieldUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgroField" }
  /agro/fields/seasons:
    post:
      operationId: createFieldSeason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldSeasonInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSeason" }
  /agro/fields/seasons/{id}:
    patch:
      operationId: updateFieldSeason
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldSeasonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSeason" }
  /agro/fields/operations:
    post:
      operationId: createFieldOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldOperationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}:
    patch:
      operationId: updateFieldOperation
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldOperationUpdate" }
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}/lifecycle:
    post:
      operationId: transitionFieldOperation
      tags: [fields]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldLifecycleInput" }
      responses:
        "200":
          description: Updated operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
        "400": { description: Invalid transition }
  /agro/fields/operations/{id}/actual:
    patch:
      operationId: updateFieldOperationActual
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldActualInput" }
      responses:
        "200":
          description: Updated actual results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}/dispatch-rate:
    patch:
      operationId: updateFieldDispatchRate
      parameters:
        - { name: id, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldDispatchRateInput" }
      responses:
        "200":
          description: Updated dispatcher rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDispatchItem" }
        "409":
          description: The field-operation version is stale
  /agro/fields/operations/{id}/progress:
    post:
      operationId: createFieldOperationProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldProgressInput" }
      responses:
        "201":
          description: Daily cumulative progress recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}/progress/{progressId}:
    patch:
      operationId: updateFieldOperationProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
        - { name: progressId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldProgressUpdate" }
      responses:
        "200":
          description: Daily report updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/fields/operations/{id}/void:
    post:
      operationId: voidFieldOperation
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldOperationVoidInput" }
      responses:
        "200":
          description: Cancelled with audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldOperation" }
  /agro/grain:
    get:
      operationId: getGrainDashboard
      tags: [grain]
      responses:
        "200":
          description: Grain ledger, directories and current inventory, tonnes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainDashboard"
  /agro/grain/transport-trips:
    get:
      operationId: getGrainTransportTrips
      responses:
        "200":
          description: Grain transport trips and per-trip rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GrainTransportTrip" }
  /agro/grain/transport-trips/{id}/rate:
    patch:
      operationId: updateGrainTransportRate
      parameters:
        - { name: id, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrainTransportRateInput" }
      responses:
        "200":
          description: Updated transport rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrainTransportTrip" }
        "409":
          description: The trip is voided or no longer available
  /agro/grain/crops:
    post:
      operationId: createGrainCrop
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainCropInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainCrop"
  /agro/grain/locations:
    post:
      operationId: createGrainLocation
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainLocationInput"
      responses:
        "201":
          description: Created storage location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainLocation"
  /agro/seeds:
    get:
      operationId: getSeedWarehouse
      tags: [grain]
      responses:
        "200":
          description: Seed stocks and movement journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedWarehouse" }
  /agro/seeds/movements:
    post:
      operationId: createSeedMovement
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedMovementInput" }
      responses:
        "201":
          description: Seed movement submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedMovement" }
  /agro/seeds/transport-trips/{id}/rate:
    patch:
      operationId: updateSeedTransportRate
      tags: [Agro]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrainTransportRateInput" }
      responses:
        "200":
          description: Updated seed trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrainTransportTrip" }
  /agro/seeds/movements/{id}/review:
    post:
      operationId: reviewSeedMovement
      tags: [grain]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedReviewInput" }
      responses:
        "200":
          description: Seed movement reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedMovement" }
  /agro/grain/movements:
    post:
      operationId: createGrainMovement
      tags: [grain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainMovementInput"
      responses:
        "201":
          description: Posted movement or safely replayed submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainMovement"
        "409":
          description: Insufficient stock or reused request key
  /agro/grain/movements/{id}/review:
    patch:
      operationId: reviewGrainMovement
      tags: [grain]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainMovementReviewInput"
      responses:
        "200":
          description: Reviewed grain movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainMovement"
        "409":
          description: Movement already reviewed or approval would cause a negative balance
  /agro/grain/movements/{id}/void:
    post:
      operationId: voidGrainMovement
      tags: [grain]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrainVoidInput"
      responses:
        "200":
          description: Cancelled movement retained in audit ledger, general director only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrainMovement"
        "409":
          description: Cancellation would cause a negative stock balance
  /engineering/fleet:
    get:
      operationId: listFleetEquipment
      tags: [engineering]
      responses:
        "200":
          description: Shared equipment directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetEquipment"
    post:
      operationId: createFleetEquipment
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FleetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetEquipment"
  /engineering/fleet/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    put:
      operationId: updateFleetEquipment
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FleetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetEquipment"
    delete:
      operationId: deleteFleetEquipment
      tags: [engineering]
      responses:
        "204":
          description: Removed only if unused, general director only
  /engineering/repair-plan/batch:
    post:
      operationId: createRepairPlanBatch
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanBatchInput"
      responses:
        "201":
          description: Plan rows added atomically
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepairEntry"
  /engineering/expenses:
    get:
      operationId: listRepairExpenses
      tags: [engineering]
      parameters:
        - { name: fleetId, in: query, schema: { type: number } }
      responses:
        "200":
          description: Equipment expense ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepairExpense"
    post:
      operationId: createRepairExpense
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairExpense"
  /engineering/expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    put:
      operationId: updateRepairExpense
      tags: [engineering]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
