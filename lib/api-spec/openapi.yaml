openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: templates
    description: Excel template catalog
  - name: dashboard
    description: Workspace overview
  - name: reports
    description: Completed report workflow
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List templates
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Add a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get template details
      parameters:
        - name: id
          in: path
          required: true
          schema:
             type: number
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
             type: number
      responses:
        "204":
          description: Deleted
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List completed reports
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, in_review, returned, approved, sent_to_management]
        - name: unit
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a completed report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Submitted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/{id}/status:
    patch:
      operationId: updateReportStatus
      tags: [reports]
      summary: Update report review status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportStatusUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /role-requests/me:
    get:
      operationId: getMyRoleRequest
      tags: [access]
      summary: Get current user's role request
      responses:
        "200":
          description: Current role request or null
          content:
            application/json:
              schema:
                type: [object, "null"]
                properties:
                  id:
                    type: number
                  userId:
                    type: string
                  email:
                    type: string
                  displayName:
                    type: string
                  department:
                    type: string
                  requestedRole:
                    type: string
                    enum: [agronomist, chief_agronomist, economist, farm_director, general_director]
                  status:
                    type: string
                    enum: [pending, approved, rejected]
                  reviewComment:
                    type: string
                  reviewedByName:
                    type: string
                  requestedAt:
                    type: string
                  reviewedAt:
                    type: [string, "null"]
                required: [id, userId, email, displayName, department, requestedRole, status, reviewComment, reviewedByName, requestedAt, reviewedAt]
  /role-requests:
    get:
      operationId: listRoleRequests
      tags: [access]
      summary: List pending role requests for the current reviewer
      responses:
        "200":
          description: Pending role requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleRequest"
    post:
      operationId: createRoleRequest
      tags: [access]
      summary: Submit or resubmit a role request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequestInput"
      responses:
        "201":
          description: Role request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequest"
  /role-requests/{id}:
    patch:
      operationId: reviewRoleRequest
      tags: [access]
      summary: Approve or reject a role request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequestDecision"
      responses:
        "200":
          description: Reviewed role request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequest"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Template:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        category:
          type: string
        department:
          type: string
        fileName:
          type: string
        fileSize:
          type: string
        fileType:
          type: string
        version:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
        downloads:
          type: number
        accessGroup:
          type: string
          enum: [all, agronomists]
        fileUrl:
          type: string
        status:
          type: string
          enum: [active, archived]
      required:
        - id
        - name
        - description
        - category
        - department
        - fileName
        - fileSize
        - fileType
        - version
        - updatedAt
        - updatedBy
        - downloads
        - accessGroup
        - fileUrl
        - status
    TemplateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        department:
          type: string
        fileName:
          type: string
        fileSize:
          type: string
        fileType:
          type: string
        accessGroup:
          type: string
          enum: [all, agronomists]
        fileUrl:
          type: string
      required:
        - name
        - description
        - category
        - department
        - fileName
        - fileSize
        - fileType
        - accessGroup
        - fileUrl
    DashboardSummary:
      type: object
      properties:
        totalTemplates:
          type: number
        departments:
          type: number
        downloadsThisMonth:
          type: number
        newThisMonth:
          type: number
      required:
        - totalTemplates
        - departments
        - downloadsThisMonth
        - newThisMonth
    Activity:
      type: object
      properties:
        id:
          type: number
        action:
          type: string
          enum: [uploaded, updated, downloaded, archived]
        templateName:
          type: string
        userName:
          type: string
        timestamp:
          type: string
      required:
        - id
        - action
        - templateName
        - userName
        - timestamp
    Report:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        unit:
          type: string
        reportType:
          type: string
          enum: [agronomy, financing_register]
        fileName:
          type: string
        fileSize:
          type: string
        fileUrl:
          type: string
        submittedBy:
          type: string
        submittedByUserId:
          type: string
        submittedAt:
          type: string
        status:
          type: string
          enum: [submitted, in_review, returned, approved, sent_to_management]
        reviewerComment:
          type: string
        reviewedBy:
          type: string
      required:
        - id
        - title
        - unit
        - reportType
        - fileName
        - fileSize
        - fileUrl
        - submittedBy
        - submittedByUserId
        - submittedAt
        - status
        - reviewerComment
        - reviewedBy
    ReportInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
        fileSize:
          type: string
        fileUrl:
          type: string
      required:
        - title
        - unit
        - fileName
        - fileSize
        - fileUrl
    ReportStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [in_review, returned, approved, sent_to_management]
        reviewerComment:
          type: string
      required:
        - status
        - reviewerComment
    RoleRequest:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        department:
          type: string
        requestedRole:
          type: string
          enum: [agronomist, chief_agronomist, economist, farm_director, general_director]
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewComment:
          type: string
        reviewedByName:
          type: string
        requestedAt:
          type: string
        reviewedAt:
          type: [string, "null"]
      required:
        - id
        - userId
        - email
        - displayName
        - department
        - requestedRole
        - status
        - reviewComment
        - reviewedByName
        - requestedAt
        - reviewedAt
    RoleRequestInput:
      type: object
      properties:
        requestedRole:
          type: string
          enum: [agronomist, chief_agronomist, economist, farm_director, general_director]
        department:
          type: string
          minLength: 1
      required:
        - requestedRole
        - department
    RoleRequestDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reviewComment:
          type: string
      required:
        - decision
        - reviewComment

